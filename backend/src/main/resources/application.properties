spring.application.name=covoit-api
spring.jpa.hibernate.ddl-auto=validate
spring.docker.compose.file=../compose.yaml
spring.docker.compose.skip.in-tests=true

spring.config.import=optional:file:../.env[.properties]
spring.docker.compose.enabled=${DOCKER_ENABLED:true}

# Connexion PostgreSQL sans Docker
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:trillcovoit_db}
spring.datasource.username=${DB_USER:user}
spring.datasource.password=${DB_PASSWORD:password}

app.jwt.secret-base64=${JWT_SECRET_BASE64}
app.jwt.issuer=trill-covoit
app.jwt.audience=trill-api
app.jwt.access-token-ttl=15m
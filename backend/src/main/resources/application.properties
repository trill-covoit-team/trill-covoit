spring.application.name=covoit-api
app.public-base-url=${PUBLIC_BASE_URL:http://localhost:8080}
spring.jpa.hibernate.ddl-auto=validate
spring.docker.compose.file=../compose.yaml
spring.docker.compose.skip.in-tests=true

spring.config.import=optional:file:../.env[.properties]
spring.docker.compose.enabled=${DOCKER_ENABLED:true}

# Connexion PostgreSQL sans Docker
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:trillcovoit_db}
spring.datasource.username=${DB_USER:user}
spring.datasource.password=${DB_PASSWORD:password}

app.jwt.secret-base64=${JWT_SECRET_BASE64}
app.jwt.issuer=trill-covoit
app.jwt.audience=trill-api
app.jwt.access-token-ttl=15m
app.auth.refresh-token-ttl=30d

spring.jackson.deserialization.accept-float-as-int=false

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
app.photo.storage-directory=./uploads/profile-photos

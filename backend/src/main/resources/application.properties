spring.application.name=covoit-api
spring.jpa.hibernate.ddl-auto=validate
spring.docker.compose.file=../compose.yaml
spring.docker.compose.skip.in-tests=false

spring.config.import=optional:file:../.env[.properties]
spring.docker.compose.enabled=${DOCKER_ENABLED:true}

# Connexion PostgreSQL sans Docker
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:trillcovoit_db}
spring.datasource.username=${DB_USER:user}
spring.datasource.password=${DB_PASSWORD:password}
